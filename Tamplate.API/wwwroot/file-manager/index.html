<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dropzone CSS -->
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script>
        window.fileManagerConfig = {
            apiBaseUrl: 'http://localhost:5068'
        };
    </script>
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-folder2-open"></i> File Manager Dashboard
            </span>
            <div class="d-flex align-items-center gap-2">
                <span id="authStatus" class="badge text-bg-secondary">Not authorized</span>
                <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#authModal">
                    <i class="bi bi-shield-lock"></i> Authorize
                </button>
            </div>

        </div>
    </nav>
    <div class="container text-center pt-4">

    </div>
    <div class="container-fluid py-4">
        <!-- Stats Row -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body">
                        <h5 class="card-title">Total Files</h5>
                        <h2 class="mb-0" id="totalFiles">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title">Images</h5>
                        <h2 class="mb-0" id="totalImages">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger text-white">
                    <div class="card-body">
                        <h5 class="card-title">Documents</h5>
                        <h2 class="mb-0" id="totalDocuments">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title">Total Size</h5>
                        <h2 class="mb-0" id="totalSize">0 Bytes</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-cloud-upload"></i> Upload Files
                    </div>
                    <div class="card-body">
                        <form action="/File" class="dropzone" id="myDropzone"></form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters and Search -->
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchInput" placeholder="Search files...">
            </div>
            <div class="col-md-4">
                <select class="form-select" id="folderSelect">
                    <option value="">All Folders</option>
                    <option value="Images">Images</option>
                    <option value="Documents">Documents</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="sortSelect">
                    <option value="name">Name</option>
                    <option value="date">Upload Date</option>
                    <option value="size">File Size</option>
                </select>
            </div>
        </div>

        <!-- Files Grid -->
        <div class="row g-3" id="filesGrid">
            <!-- Files will be inserted here by jQuery -->
        </div>

        <!-- Loading State -->
        <div class="text-center py-5" id="loadingState" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading files...</p>
        </div>

        <!-- Empty State -->
        <div class="text-center py-5" id="emptyState" style="display: none;">
            <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
            <p class="mt-3 text-muted">No files found</p>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="previewModalTitle">File Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center" id="previewModalBody">
                    <!-- Preview content will be inserted here -->
                </div>
                <div class="modal-footer">
                    <a href="#" class="btn btn-primary" id="downloadBtn" download>
                        <i class="bi bi-download"></i> Download
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="authModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="authModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="authModalLabel">Authorize</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-3">Sign in to get a JWT and continue using the file manager.</p>

                    <div class="mb-3">
                        <label for="authUsername" class="form-label">Username</label>
                        <input id="authUsername" type="text" class="form-control" placeholder="Username" aria-label="Username">
                    </div>

                    <div class="mb-3">
                        <label for="authPassword" class="form-label">Password</label>
                        <input id="authPassword" type="password" class="form-control" placeholder="Password" aria-label="Password">
                    </div>

                </div>
                <div class="modal-footer">
                    <button id="clearAuth" type="button" class="btn btn-outline-danger me-auto">Logout</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button id="auth" type="button" class="btn btn-primary">Authenticate</button>
                </div>
            </div>
        </div>
    </div>
    <!-- jQuery (must load first) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dropzone JS -->
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>

    <!-- Your Custom Script -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
